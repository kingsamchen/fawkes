name: Lint

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - '.githooks/**'

jobs:
  lint:
    runs-on: ubuntu-26.04

    env:
      VCPKG_ROOT: "/usr/local/share/vcpkg"

    steps:
      - uses: actions/checkout@v4

      - name: Add repository for clang-format and clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main

      - name: Add Ubuntu mirrors
        run: |
          # Github Actions caching proxy is at times unreliable
          # see https://github.com/actions/runner-images/issues/7048
          printf 'http://azure.archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/mirrors.txt
          curl http://mirrors.ubuntu.com/mirrors.txt | sudo tee --append /etc/apt/mirrors.txt
          sudo sed -i 's~http://azure.archive.ubuntu.com/ubuntu/~mirror+file:/etc/apt/mirrors.txt~' /etc/apt/sources.list

      - name: Install required tools
        run: |
          sudo apt update
          sudo apt install -y clang-22 clang-format-22 clang-tidy-22 ninja-build
          sudo pip3 install cpplint cmake

      - name: Run cpplint
        run: |
          targets=(fawkes examples test_utils)
          cpplint --quiet --recursive "${targets[@]}"

      - name: Run clang-format
        run: |
          targets=(fawkes examples test_utils)
          find "${targets[@]}" -type f -regextype posix-extended -regex '.*\.(hpp|h|cpp|cc|c)$' |\
            xargs clang-format-22 --dry-run -Werror

      - name: Run cmake-fmt
        run: |
          targets=(cmake examples fawkes test_utils CMakeLists.txt)
          .githooks/scripts/cmake-fmt.py --diff "${targets[@]}"

      - name: Run clang-tidy
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake --preset linux-ci -DFAWKES_USE_SANITIZERS="" -DFAWKES_BUILD_EXAMPLES=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          run-clang-tidy-22 -p out/linux-ci -source-filter '.*\/fawkes\/(fawkes|examples|test_utils)\/.*'
