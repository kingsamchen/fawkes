name: Build and test on Linux with Clang

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - '.githooks/**'

jobs:
  build-and-test:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        cxx: [clang++-20, clang++-21, clang++-22]
        include:
          - cxx: clang++-20
            cc: clang-20
            install: sudo apt install -y clang-20 clang-tools-20
          - cxx: clang++-21
            cc: clang-21
            install: sudo apt install -y clang-21 clang-tools-21
          - cxx: clang++-22
            cc: clang-22
            install: sudo apt install -y clang-22 clang-tools-22

    env:
      VCPKG_ROOT: "/usr/local/share/vcpkg"

    steps:
      - uses: actions/checkout@v4

      - name: Add repositories for newer Clang
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          # sudo add-apt-repository -y deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-20 main
          sudo add-apt-repository -y deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-21 main
          sudo add-apt-repository -y deb http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main

      - name: Add Ubuntu mirrors
        run: |
          # Github Actions caching proxy is at times unreliable
          # see https://github.com/actions/runner-images/issues/7048
          printf 'http://azure.archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/mirrors.txt
          curl http://mirrors.ubuntu.com/mirrors.txt | sudo tee --append /etc/apt/mirrors.txt
          sudo sed -i 's~http://azure.archive.ubuntu.com/ubuntu/~mirror+file:/etc/apt/mirrors.txt~' /etc/apt/sources.list

      - name: Create Build Environment
        run: |
          sudo apt update
          ${{matrix.install}}
          sudo apt install -y ninja-build
          sudo pip3 install cmake

      - name: Setup vcpkg binary cache
        id: vcpkg-cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          c-compiler: ${{matrix.cc}}
          cxx-compiler: ${{matrix.cxx}}
          target-triplet: x64-linux

      - name: Configure
        id: vcpkg-configure
        env:
          CC: ${{matrix.cc}}
          CXX: ${{matrix.cxx}}
        run: |
          cmake --preset linux-ci

      - name: Save vcpkg binary packages
        if: steps.vcpkg-configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cmake --build --preset linux-ci

      - name: Test
        run: |
          ctest --preset linux-ci
