name: Build and test on Linux with GCC

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - '.githooks/**'

jobs:
  build-and-test:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        cxx: [g++-13, g++-14, g++-15]
        include:
          - cxx: g++-13
            install: sudo apt install -y g++-13
          - cxx: g++-14
            install: sudo apt install -y g++-14
          - cxx: g++-15
            install: sudo apt install -y g++-15

    env:
      VCPKG_ROOT: "/usr/local/share/vcpkg"

    steps:
      - uses: actions/checkout@v4

      - name: Add Ubuntu mirrors
        run: |
          # Github Actions caching proxy is at times unreliable
          # see https://github.com/actions/runner-images/issues/7048
          printf 'http://azure.archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/mirrors.txt
          curl http://mirrors.ubuntu.com/mirrors.txt | sudo tee --append /etc/apt/mirrors.txt
          sudo sed -i 's~http://azure.archive.ubuntu.com/ubuntu/~mirror+file:/etc/apt/mirrors.txt~' /etc/apt/sources.list

      - name: Create Build Environment
        run: |
          sudo apt update
          ${{matrix.install}}
          sudo apt install -y ninja-build

      - name: Setup vcpkg binary cache
        id: vcpkg-cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          c-compiler: cc
          cxx-compiler: ${{matrix.cxx}}
          target-triplet: x64-linux

      - name: Configure
        id: vcpkg-configure
        env:
          CXX: ${{matrix.cxx}}
        run: |
          cmake --preset linux-ci

      - name: Save vcpkg binary packages
        if: steps.vcpkg-configure.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cmake --build --preset linux-ci

      - name: Test
        run: |
          ctest --preset linux-ci
